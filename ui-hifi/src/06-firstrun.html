<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css"><style>
.wrap{padding:24px 24px 0}
.dots{display:flex;gap:6px;margin-bottom:28px}.dots i{width:8px;height:8px;border-radius:4px;background:var(--ov)}.dots i.on{width:24px;background:var(--primary)}
h1{font-size:28px;font-weight:600;line-height:38px;margin:0 0 10px;letter-spacing:-.4px}
.lead{font-size:15px;line-height:24px;color:var(--onv);margin:0 0 24px}
.opt{border-radius:20px;padding:18px;margin-bottom:14px;background:var(--surface);border:2px solid transparent}
.opt.on{border-color:var(--primary);background:color-mix(in srgb,var(--pc) 45%,var(--surface))}
.opt .h{display:flex;align-items:center;gap:12px}.opt .h b{font-size:18px;font-weight:600;flex:1}
.opt p{font-size:14px;line-height:22px;color:var(--onv);margin:10px 0 12px}
.opt ul{margin:0;padding:0;list-style:none;font-size:13.5px;line-height:24px}
.opt li{display:flex;gap:6px;align-items:center}.opt li .ms{font-size:16px;color:var(--primary)}
.rd{width:22px;height:22px;border-radius:11px;border:2px solid var(--outline);box-sizing:border-box}.on .rd{border:7px solid var(--primary)}
.bot{position:absolute;left:24px;right:24px;bottom:44px}
.bot .btn{width:100%;height:52px;border-radius:26px;font-size:16px;box-sizing:border-box}
</style></head><body>
<div class="sb"><span>9:41</span><span class="r"><span class="ms fill">signal_cellular_alt</span><span class="ms fill">wifi</span><span class="ms fill">battery_5_bar</span></span></div>
<div class="wrap"><div class="dots"><i class="on"></i><i></i><i></i></div>
<h1>你想让 AI<br>怎么帮你写？</h1><p class="lead">两种方式都能用好灵写，之后可在设置里随时切换。</p>
<div class="opt"><div class="h"><div class="tile" style="background:var(--pc);color:var(--on-pc)"><span class="ms">draw</span></div><b>辅助模式</b><div class="rd"></div></div><p>你来写，AI 在旁边：查设定、提建议、改句子。</p><ul><li><span class="ms">check</span>正文主要出自你手</li><li><span class="ms">check</span>AI 建议默认不进正文</li></ul></div>
<div class="opt"><div class="h"><div class="tile" style="background:var(--tc);color:var(--on-tc)"><span class="ms">auto_awesome</span></div><b>生成模式</b><div class="rd"></div></div><p>你定大纲和章纲，AI 起草整章，你来改。</p><ul><li><span class="ms">check</span>按章纲生成，自动带入设定</li><li><span class="ms">check</span>AI 段落标记，可随时查看</li></ul></div>
</div>
<div class="bot"><span class="btn" style="background:color-mix(in srgb,var(--on) 12%,transparent);color:color-mix(in srgb,var(--on) 40%,transparent)">选择一种方式继续</span><div style="text-align:center;font-size:13px;color:var(--onv);margin-top:12px">数据只存在这台手机上</div></div>
<div class="nav"><i></i></div>
<script src="theme.js"></script></body></html>
