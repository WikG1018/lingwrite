name: 功能建议 / Feature request
description: 想要的新功能或改进 / Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: 想解决什么问题 / What problem does this solve?, description: 写作时遇到的具体场景 / Describe the writing situation }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: 设想的做法 / Proposed solution }
  - type: checkboxes
    id: principles
    attributes:
      label: 原则 / Principles
      options:
        - label: 不需要把数据发到作者没选的服务器 / Doesn't send data to servers the author didn't choose
        - label: 辅助模式下不会替作者直接改正文 / Doesn't rewrite the manuscript in Assist mode without confirmation
