# SPDX-License-Identifier: AGPL-3.0-only
# 打 tag（v*）时：用仓库 Secrets 里的正式密钥签名 → apksigner 验证证书 → 生成 .sha256 → 发正式 Release。
# 需要的 Secrets：LINGWRITE_KEYSTORE_BASE64、LINGWRITE_STORE_PASSWORD、LINGWRITE_KEY_ALIAS、LINGWRITE_KEY_PASSWORD
# 发布说明：docs/release-notes/<tag>.md（没有就用 tag 注释）；SHA-256 行由本工作流追加。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  EXPECTED_CERT_SHA256: f31f5b4f455617f50337dc1bf1643023811d26464c3074e6cc706e4f1f3fce52

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with: { path: ~/.gradle/caches/lingwrite-misans, key: misans-v1 }

      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME=$(grep -Po 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          [ "v$NAME" = "$TAG" ] || { echo "::error::versionName $NAME 与 tag $TAG 不一致"; exit 1; }

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.LINGWRITE_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::缺少 LINGWRITE_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "LINGWRITE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release
        working-directory: android
        env:
          LINGWRITE_STORE_PASSWORD: ${{ secrets.LINGWRITE_STORE_PASSWORD }}
          LINGWRITE_KEY_ALIAS: ${{ secrets.LINGWRITE_KEY_ALIAS }}
          LINGWRITE_KEY_PASSWORD: ${{ secrets.LINGWRITE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature and hash
        id: verify
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          APK="lingwrite-${TAG}.apk"
          mkdir -p dist && cp android/app/build/outputs/apk/release/app-release.apk "dist/$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "dist/$APK" | tee dist/certs.txt
          CERT=$(grep -m1 'certificate SHA-256 digest' dist/certs.txt | awk '{print $NF}')
          [ "$CERT" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::签名证书不是正式证书：$CERT"; exit 1; }
          "$BT/aapt2" dump badging "dist/$APK" | head -1 | tee dist/badging.txt
          (cd dist && sha256sum "$APK" > "$APK.sha256")
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha=$(cut -d' ' -f1 dist/$APK.sha256)" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES="docs/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then cp "$NOTES" dist/notes.md; else git tag -l --format='%(contents)' "$TAG" > dist/notes.md; fi
          {
            echo
            echo "SHA-256: \`${{ steps.verify.outputs.sha }}\`"
            echo
            echo "证书 SHA-256: \`$EXPECTED_CERT_SHA256\`（CN=LingWrite）"
            echo
            echo "\`aapt2 dump badging\`：\`$(grep -o "versionCode='[0-9]*' versionName='[^']*'" dist/badging.txt)\`"
          } >> dist/notes.md
          gh release create "$TAG" --title "LingWrite $TAG" --notes-file dist/notes.md --latest \
            "dist/${{ steps.verify.outputs.apk }}" "dist/${{ steps.verify.outputs.apk }}.sha256"
